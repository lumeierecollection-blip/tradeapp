name: Refresh Forex Data
on:
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy requests yfinance
      - run: python signal_aggregator/backend/data/forex_fetcher.py
      # data/raw/ is gitignored and nothing reads it, so publish it as a build artifact instead of committing.
      - uses: actions/upload-artifact@v4
        with:
          name: raw-data
          path: signal_aggregator/data/raw/
          if-no-files-found: warn
