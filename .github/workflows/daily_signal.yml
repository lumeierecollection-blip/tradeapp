name: Generate Forex Signals
on:
  schedule: [{ cron: '0 */4 * * *' }]
  workflow_dispatch:
jobs:
  signals:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pandas numpy requests yfinance transformers torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: python signal_aggregator/backend/signals/signal_aggregator.py
        env:
          MYFXBOOK_EMAIL: ${{ secrets.MYFXBOOK_EMAIL }}
          MYFXBOOK_PASSWORD: ${{ secrets.MYFXBOOK_PASSWORD }}
      - run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add signal_aggregator/data/signals/
          git commit -m "Update signals [skip ci]" || echo "no changes"
          git push
